name: Release

# Tag-driven release notes hook + artifact packaging (B024).
# Deploy/rollback steps are placeholders until hosting is chosen.

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

  release-notes:
    name: Release notes hook
    runs-on: ubuntu-latest
    needs: [validate-tag]
    steps:
      - uses: actions/checkout@v4
      - name: Emit release notes pointer
        run: |
          echo "## RegIntel ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See docs/RELEASE_NOTES.md and docs/CHANGELOG.md for human-authored notes." >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/RELEASE_NOTES.md ]; then
            head -n 40 docs/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
          fi

  package:
    name: Package release artifact
    runs-on: ubuntu-latest
    needs: [validate-tag]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          mkdir -p ../artifacts
          tar -czf ../artifacts/regintel-api-${GITHUB_REF_NAME}.tgz dist prisma package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: artifacts/*

  deploy-placeholder:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - name: Placeholder deploy
        run: |
          echo "Deploy placeholder for ${GITHUB_REF_NAME}."
          echo "Wire this job to the chosen host (ECS/K8s/Fly/Render) in a future change."
          echo "Required inputs would include image digest, env secrets, and migration gate."

  rollback-placeholder:
    name: Rollback (placeholder)
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Placeholder rollback
        run: |
          echo "Rollback workflow placeholder — enable via workflow_dispatch when deploy target exists."
